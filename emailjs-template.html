<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f5f4f2;font-family:Georgia,'Times New Roman',serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f4f2;padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">

          <!-- Header -->
          <tr>
            <td style="background:#FCD6E3;padding:40px 40px 32px;text-align:center;border-radius:4px 4px 0 0;">
              <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:normal;color:#DA2631;letter-spacing:0.02em;">
                darlings
              </h1>
              <p style="margin:8px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:#DA2631;opacity:0.7;">
                MAKE-UP
              </p>
            </td>
          </tr>

          <!-- Subject line -->
          <tr>
            <td style="background:#ffffff;padding:32px 40px 24px;border-bottom:1px solid #f0eeeb;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#DA2631;">
                New Website Enquiry
              </p>
              <h2 style="margin:8px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:normal;color:#2A2521;line-height:1.3;">
                {{service}}
              </h2>
            </td>
          </tr>

          <!-- Details -->
          <tr>
            <td style="background:#ffffff;padding:24px 40px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #f0eeeb;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#999;">Name</span><br>
                    <span style="font-family:Georgia,serif;font-size:16px;color:#2A2521;">{{from_name}}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #f0eeeb;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#999;">Email</span><br>
                    <a href="mailto:{{from_email}}" style="font-family:Georgia,serif;font-size:16px;color:#DA2631;text-decoration:none;">{{from_email}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #f0eeeb;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#999;">Phone</span><br>
                    <span style="font-family:Georgia,serif;font-size:16px;color:#2A2521;">{{phone}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Full details -->
          <tr>
            <td style="background:#faf9f7;padding:24px 40px;border-top:1px solid #f0eeeb;">
              <p style="margin:0 0 12px;font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#999;">
                Full Details
              </p>
              <pre style="margin:0;font-family:Georgia,serif;font-size:14px;color:#2A2521;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;">{{details}}</pre>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="background:#ffffff;padding:24px 40px 32px;border-top:1px solid #f0eeeb;">
              <p style="margin:0 0 12px;font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#999;">
                Message
              </p>
              <p style="margin:0;font-family:Georgia,serif;font-size:15px;color:#2A2521;line-height:1.7;">
                {{message}}
              </p>
            </td>
          </tr>

          <!-- Reply CTA -->
          <tr>
            <td style="background:#ffffff;padding:0 40px 32px;text-align:center;">
              <a href="mailto:{{from_email}}" style="display:inline-block;padding:14px 40px;background:#2A2521;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;border-radius:3px;">
                Reply to {{from_name}}
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;text-align:center;border-radius:0 0 4px 4px;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#999;line-height:1.6;">
                This enquiry was submitted via the Darlings website contact form.<br>
                &copy; Darlings Make-Up — darlingsmakeup.be
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
